<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Grounded Verdict</title>
<style>
body{margin:0;font:16px/1.45 system-ui;background:#07090d;color:#eef3f8}
main{max-width:820px;margin:auto;padding:28px 16px}
.addr,.err{font-family:ui-monospace,monospace;font-size:13px;color:#9ecbff;word-break:break-all}
.err{color:#ff8a8a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button,input{padding:10px 12px;border-radius:10px;border:1px solid #243041;background:#121820;color:#fff}
article{background:#121820;border:1px solid #243041;border-radius:16px;padding:16px;margin:12px 0}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.SUPPORTED{background:#123d2c;color:#3dd68c}
.REFUTED{background:#3d1515;color:#ff6b6b}
.INCONCLUSIVE{background:#3d3410;color:#f5c542}
.OPEN,.SEALED,.CHALLENGED{background:#1b2430;color:#9ecbff}
pre{white-space:pre-wrap;color:#93a1b3}
</style>
</head>
<body>
<main>
  <h1>Grounded Verdict</h1>
  <p>Live read from Studionet. No wallet needed.</p>
  <p class="addr" id="addr">0xb354a893b31C0D6CBf55402fa2BB7cC0D8Ca2011</p>
  <div class="row">
    <input id="cid" value="1" style="width:80px"/>
    <button id="one">Check case</button>
    <button id="all">Check 1 / 2 / 3</button>
  </div>
  <p class="err" id="err"></p>
  <div id="box"></div>
</main>
<script type="module">
import { createClient } from "https://esm.sh/genlayer-js@0.18.0?bundle";
import { studionet } from "https://esm.sh/genlayer-js@0.18.0/chains?bundle";

const CONTRACT = "0xb354a893b31C0D6CBf55402fa2BB7cC0D8Ca2011";
const client = createClient({
  chain: studionet,
  endpoint: "https://studio.genlayer.com/api",
  account: "0x0000000000000000000000000000000000000000",
});

function card(id, raw) {
  let data = raw;
  if (typeof raw === "string") {
    try { data = JSON.parse(raw); } catch { data = { status: raw, raw }; }
  }
  const status = (data && data.status) || "UNKNOWN";
  const el = document.createElement("article");
  el.innerHTML = `
    <span class="tag ${status}">${status}</span>
    <h3>Case ${id}</h3>
    <p>${data.question || ""}</p>
    <p>${data.justification || ""}</p>
    <pre>${JSON.stringify(data, null, 2)}</pre>`;
  return el;
}

async function readCase(id) {
  return client.readContract({
    address: CONTRACT,
    functionName: "get_case",
    args: [String(id)],
    stateStatus: "accepted",
  });
}

async function show(ids) {
  err.textContent = "reading…";
  box.innerHTML = "";
  try {
    for (const id of ids) {
      const raw = await readCase(id);
      box.appendChild(card(id, raw));
    }
    err.textContent = "";
  } catch (e) {
    err.textContent = String(e.message || e);
  }
}

one.onclick = () => show([cid.value.trim() || "1"]);
all.onclick = () => show(["1", "2", "3"]);
show(["1", "2", "3"]);
</script>
</body>
</html>
